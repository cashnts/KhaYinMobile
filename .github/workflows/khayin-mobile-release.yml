name: KhaYin Mobile Android Release & Cloudflare R2 Pipeline

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version tag override (e.g. 1.0.6). Leave empty to use Version.xcconfig'
        required: false
        type: string
        default: ''
      channel:
        description: 'Target channel (auto, dev, release)'
        required: true
        type: choice
        options:
          - auto
          - dev
          - release
        default: auto
      upload_to_r2:
        description: 'Upload release artifacts to Cloudflare R2'
        required: true
        type: boolean
        default: true
      create_github_release:
        description: 'Publish or update GitHub Release (only for release channel/tags)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - dev
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: khayin-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve Version Metadata
  # ---------------------------------------------------------------------------
  metadata:
    name: Resolve Version Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      clean_version: ${{ steps.version_step.outputs.clean_version }}
      channel: ${{ steps.version_step.outputs.channel }}
      target_dir: ${{ steps.version_step.outputs.target_dir }}
      is_release: ${{ steps.version_step.outputs.is_release }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            RAW_VERSION="${{ inputs.version_override }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          elif [ -f "iosApp/Configuration/Version.xcconfig" ]; then
            RAW_VERSION=$(grep "^MARKETING_VERSION" iosApp/Configuration/Version.xcconfig | cut -d'=' -f2 | tr -d ' \r\n')
          else
            RAW_VERSION="1.0.6"
          fi
          
          CLEAN_VERSION=$(echo "${RAW_VERSION}" | tr -cd '[:alnum:]._-')
          
          # Determine channel: release if tagged v* or inputs.channel == 'release', else dev
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [[ "${{ inputs.channel }}" == "release" ]]; then
            CHANNEL="release"
            TARGET_DIR="v${CLEAN_VERSION}"
            IS_RELEASE="true"
          else
            CHANNEL="dev"
            TARGET_DIR="dev/${CLEAN_VERSION}"
            IS_RELEASE="false"
          fi

          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "target_dir=${TARGET_DIR}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${CLEAN_VERSION}, channel: ${CHANNEL}, target R2 dir: ${TARGET_DIR}"

  # ---------------------------------------------------------------------------
  # 2. Build Android (Release APK)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Keystore from Secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KHAYIN_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PROPERTIES_BASE64: ${{ secrets.KHAYIN_LOCAL_PROPERTIES_BASE64 || secrets.RELEASE_PROPERTIES_BASE64 || secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
            keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
            printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
            echo "NUVIO_RELEASE_STORE_FILE=${keystore_path}" >> "$GITHUB_ENV"
            echo "KHAYIN_RELEASE_STORE_FILE=${keystore_path}" >> "$GITHUB_ENV"
            echo "Loaded release keystore from secrets."
          fi
          if [ -n "${RELEASE_PROPERTIES_BASE64}" ]; then
            printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
            echo "Loaded local.properties from secrets."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Release APK
        env:
          KHAYIN_RELEASE_STORE_PASSWORD: ${{ secrets.KHAYIN_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          KHAYIN_RELEASE_KEY_ALIAS: ${{ secrets.KHAYIN_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.NUVIO_RELEASE_KEY_ALIAS }}
          KHAYIN_RELEASE_KEY_PASSWORD: ${{ secrets.KHAYIN_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.KHAYIN_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.KHAYIN_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.KHAYIN_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KHAYIN_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KHAYIN_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.NUVIO_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KHAYIN_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleFullRelease \
            -Pnuvio.client.role=user \
            -Pnuvio.android.distribution=full \
            --parallel \
            --build-cache \
            --stacktrace

      - name: Rename and Prepare Android Artifacts
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          mkdir -p dist
          
          # Find universal APK first, or standard release APK
          UNIVERSAL_APK=$(find androidApp/build/outputs/apk/full/release -type f -name "*universal*.apk" 2>/dev/null | head -n 1)
          MAIN_APK=$(find androidApp/build/outputs/apk/full/release -type f -name "*.apk" 2>/dev/null | head -n 1)
          FALLBACK_APK=$(find androidApp/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -n "$UNIVERSAL_APK" ] && [ -f "$UNIVERSAL_APK" ]; then
            cp "$UNIVERSAL_APK" "dist/khayin-android-v${VERSION}.apk"
            echo "Selected universal APK: $UNIVERSAL_APK -> dist/khayin-android-v${VERSION}.apk"
          elif [ -n "$MAIN_APK" ] && [ -f "$MAIN_APK" ]; then
            cp "$MAIN_APK" "dist/khayin-android-v${VERSION}.apk"
            echo "Selected release APK: $MAIN_APK -> dist/khayin-android-v${VERSION}.apk"
          elif [ -n "$FALLBACK_APK" ] && [ -f "$FALLBACK_APK" ]; then
            cp "$FALLBACK_APK" "dist/khayin-android-v${VERSION}.apk"
            echo "Selected fallback APK: $FALLBACK_APK -> dist/khayin-android-v${VERSION}.apk"
          else
            echo "Error: No Android APK found in build outputs!" >&2
            find androidApp/build/outputs -type f || true
            exit 1
          fi
          
          ls -la dist/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Collect, Upload to Cloudflare R2 & Publish Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Upload to Cloudflare R2 & Publish Release
    needs: [metadata, build-android]
    runs-on: ubuntu-latest
    if: always() && (needs.build-android.result == 'success')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: release-files

      - name: List Collected Release Files
        run: |
          echo "=== Collected Release Artifacts ==="
          ls -la release-files/

      # Upload to Cloudflare R2 using AWS CLI with custom S3 endpoint
      - name: Upload to Cloudflare R2 Bucket
        if: github.event_name == 'push' || inputs.upload_to_r2 != false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          MISSING=0
          if [ -z "${R2_ACCOUNT_ID}" ]; then echo "::warning ::Secret R2_ACCOUNT_ID is empty or not found in repository secrets."; MISSING=1; fi
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then echo "::warning ::Secret R2_ACCESS_KEY_ID is empty or not found in repository secrets."; MISSING=1; fi
          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then echo "::warning ::Secret R2_SECRET_ACCESS_KEY is empty or not found in repository secrets."; MISSING=1; fi
          if [ -z "${R2_BUCKET_NAME}" ]; then echo "::warning ::Secret R2_BUCKET_NAME is empty or not found in repository secrets."; MISSING=1; fi
          
          if [ "$MISSING" -eq 1 ]; then
            echo "Error: Cloudflare R2 secrets are missing. Skipping R2 upload."
            exit 1
          fi

          ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TARGET_DIR="${{ needs.metadata.outputs.target_dir }}"
          
          echo "Uploading release artifacts to Cloudflare R2: s3://${R2_BUCKET_NAME}/${TARGET_DIR}/"
          
          for file in release-files/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading $filename -> s3://${R2_BUCKET_NAME}/${TARGET_DIR}/${filename}"
              aws s3 cp "$file" "s3://${R2_BUCKET_NAME}/${TARGET_DIR}/${filename}" \
                --endpoint-url "${ENDPOINT_URL}" \
                --region auto
            fi
          done

          echo "Upload complete! Contents in bucket folder ${TARGET_DIR}:"
          aws s3 ls "s3://${R2_BUCKET_NAME}/${TARGET_DIR}/" --endpoint-url "${ENDPOINT_URL}" --region auto || true

      # Publish or update GitHub Release (only for release tags / release channel)
      - name: Publish GitHub Release
        if: needs.metadata.outputs.is_release == 'true' && (github.event_name == 'push' || inputs.create_github_release != false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.metadata.outputs.version }}"
          name: "KhaYin Mobile v${{ needs.metadata.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
